<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>SSH terminal · Sequoia Chat Lab</title>
 <link rel="stylesheet" href="/vendor/xterm/xterm.css">
 <link rel="stylesheet" href="/ssh-terminal.css">
 <script src="/vendor/xterm/xterm.js" defer></script>
 <script type="module" src="/ssh-terminal.js"></script>
</head>
<body>
 <header>
  <div>
   <h1>SSH terminal</h1>
   <p id="status" role="status">Opening terminal…</p>
   <p id="credential" hidden></p>
   <p id="exchange" hidden></p>
  </div>
  <div class="controls" aria-label="Terminal font size">
   <button type="button" id="smaller" aria-label="Decrease font size">−</button>
   <button type="button" id="font-size" title="Reset font size" aria-label="Reset font size">14 px</button>
   <button type="button" id="larger" aria-label="Increase font size">+</button>
   <button type="button" id="files-open" disabled>Transfer files</button>
   <button type="button" id="close">Close terminal</button>
  </div>
 </header>
 <main id="terminal" aria-label="SSH terminal"></main>
 <dialog id="files-dialog" aria-labelledby="files-title">
  <h2 id="files-title">Transfer files</h2>
  <p>Copy files between this SSH host and encrypted Local files. Up to 16 MiB per file.</p>
  <div class="file-picker">
   <section>
    <h3>Remote host</h3>
    <label for="files-path">Directory</label>
    <div class="file-actions">
     <input id="files-path" value="." maxlength="4096">
     <button id="files-browse" type="button">Go</button>
     <button id="files-parent" type="button">Up</button>
    </div>
    <label for="files-remote">Remote files and folders</label>
    <select id="files-remote" size="7"></select>
    <button id="files-folder" type="button">Open folder</button>
    <button id="files-get" type="button">Copy to encrypted store</button>
   </section>
   <section>
    <h3>Encrypted Local files</h3>
    <label for="files-local">File</label>
    <select id="files-local" size="7"></select>
    <button id="files-put" type="button">Copy to remote directory</button>
   </section>
  </div>
  <p id="files-status" role="status"></p>
  <button id="files-done" type="button">Close</button>
 </dialog>
</body>
</html>
