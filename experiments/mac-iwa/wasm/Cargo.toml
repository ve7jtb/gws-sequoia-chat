[package]
name = "sequoia-iwa-verify"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
# Public bundle parsing uses RustCrypto only; no native token, subprocess,
# filesystem, OpenSSL or private-key adapter is linked into the worker.
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
ml-dsa = { version = "=0.1.2", default-features = false, features = ["alloc"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa"] }
wasm-bindgen = "=0.2.130"
sequoia-openpgp = { git = "https://github.com/ve7jtb/sequoia.git", rev = "65979cf360ec0908c793d8801dd4491da2b8398d", default-features = false, features = ["crypto-rust", "compression-deflate", "allow-experimental-crypto", "allow-variable-time-crypto"] }
[dev-dependencies]
# Tests emulate the two card operations with disposable software keys. These
# algorithms already occur in Sequoia's locked dependency graph; no hardware
# library or provisioning command participates in the regression tests.
ml-kem = { version = "=0.3.4", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
[profile.release]
opt-level = "s"
lto = true
